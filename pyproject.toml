[project]
name = "chatmark"
version = "0.1.0"
description = "A standalone Typer CLI tool for converting AI conversation exports from various IDEs and CLI tools to beautifully styled HTML and PDF versions"
requires-python = ">=3.11"
dependencies = [
    "markdown>=3.5",
    "rich>=13.0",
    "typer>=0.12",
    "weasyprint>=62.0",
]

[dependency-groups]
dev = [
    "pre-commit>=4.4.0",
    "pytest>=9.0.1",
    "ruff>=0.14.4",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
