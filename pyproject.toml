[project]
name = "chatmark"
version = "0.1.0"
description = "A standalone Typer CLI tool for converting AI conversation exports from various IDEs and CLI tools to beautifully styled HTML and PDF versions"
requires-python = ">=3.12"
dependencies = [
    "markdown>=3.5",
    "rich>=13.0",
    "typer>=0.12",
    "weasyprint>=62.0",
]

[dependency-groups]
dev = [
    "pre-commit>=4.4.0",
    "pytest>=9.0.1",
    "pytest-cov>=6.0.0",
    "ruff>=0.14.4",
]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["chatmark*"]
exclude = ["temp*", "tests*", "docs*", "examples*"]

[tool.uv]
package = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = []
exclude = ["md_to_html.py", "main.py"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[project.scripts]
chatmark = "chatmark.cli:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
