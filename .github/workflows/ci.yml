name: CI - Tests and Linting

on:
  # Avoid duplicate runs: run on PRs for branches, and on direct pushes to main
  # Ignore changes to release-generated files
  push:
    branches: ["main"]
    paths-ignore:
      - "CHANGELOG.md"
      - "*.html"
      - "*.pdf"
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          # Install dependencies from PEP 723 inline script metadata
          uv pip install markdown typer rich weasyprint

      - name: Run tests
        run: |
          echo "Tests will be added here"
          # TODO: Add pytest tests when test suite is created
          # uv run pytest tests/

  lint:
    name: Run Linting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ruff
        run: uv pip install ruff

      - name: Run ruff (linter)
        run: uv run ruff check .

      - name: Run ruff (formatter)
        run: uv run ruff format --check .

      - name: Install pre-commit
        run: uv pip install pre-commit

      - name: Run pre-commit hooks
        run: uv run pre-commit run --all-files
